name: Deploy site to Cloudflare Pages

# The live site is a Pages project using direct upload, so it does not build
# from this repo by itself. This workflow publishes the website files to the
# "obi" Pages project on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the website files
        run: |
          mkdir -p dist
          cp index.html obi.html setup.html download.html LICENSE dist/
          cp -r css js firmware assets dist/
          echo "staged $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3cb0762fb04b05ae45822ea969c3a7a9
        run: npx --yes wrangler@latest pages deploy dist --project-name=obi --branch=main --commit-dirty=true
